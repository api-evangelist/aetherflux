aid: aetherflux
name: Cowboy Space Corporation (formerly Aetherflux)
description: 'Cowboy Space Corporation is an American orbital-infrastructure company
  founded in 2024 by Baiju Bhatt, co-founder and former co-CEO of Robinhood, headquartered
  in San Carlos, California with a second site in Seattle, Washington. It operated
  as Aetherflux Inc. from founding until May 2026, when it renamed to Cowboy Space
  Corporation and broadened its mission from space-based solar power alone to vertically
  integrated orbital infrastructure for the AI era, spanning launch vehicles, space-based
  power generation and in-orbit compute. Its flagship program is Stampede, a Low Earth
  Orbit constellation of satellites that harvest solar power to run on-orbit GPU data
  centers, with the first Galactic Brain data-center node targeted for early 2027 using
  NVIDIA Space-1 Vera Rubin modules and a small infrared power-beaming demonstrator
  satellite planned for 2026. The company concluded that launch supply was the binding
  constraint on orbital compute and is therefore also developing its own rocket, sized
  between Falcon 9 and Starship at roughly 20,000-25,000 kg of payload, whose upper
  stage is itself the payload - each one intended to become a one-megawatt orbital data
  center - with a first launch targeted for the end of 2028. It has raised roughly USD
  365 million to date, including a USD 50 million Series A in April 2025 and a USD 275
  million Series B in May 2026 at a USD 2 billion valuation, led by Index Ventures with
  IVP, Blossom Capital, SAIC, Breakthrough Energy Ventures, Construct Capital, Andreessen
  Horowitz, NEA and Interlagos participating. Cowboy Space is a space hardware and energy
  infrastructure company, not a software vendor: as of August 2026 it publishes no developer
  portal, no API documentation, no SDK, no public GitHub organization and no machine-readable
  API contract of any kind. Its entire public web presence is a four-page Framer-hosted
  marketing site (home, terms, privacy, media terms of use) plus an Ashby-hosted careers
  board.'
