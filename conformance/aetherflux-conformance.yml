scope: >-
  Cowboy Space Corporation publishes no API, so there are no API or cross-cutting
  technical standards to assert. What the company is actually measured against is
  launch and spectrum licensing for its satellites and rockets, plus US export control
  for space hardware. Those regimes are recorded here as applicable with their status
  stated honestly as not-yet-evidenced rather than achieved, and the API/protocol block
  is recorded as not-applicable rather than false, so this file is never mistaken for a
  compliance posture the company does not claim.
regulatory_regime:
